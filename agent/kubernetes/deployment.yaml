apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-agent
  template:
    metadata:
      labels:
        app: triage-agent
    spec:
      containers:
      - name: agent
        image: triage-agent-agent:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http-api
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/secrets/google/application_default_credentials.json"
        envFrom:
        - configMapRef:
            name: triage-agent-config
        - secretRef:
            name: gemini-secret
            optional: true
        volumeMounts:
        - name: gcp-adc-volume
          mountPath: /var/secrets/google
          readOnly: true
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: gcp-adc-volume
        secret:
          secretName: gcp-adc
          optional: true
